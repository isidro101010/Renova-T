<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A professional Snake game with smooth gameplay, score tracking, and difficulty levels">
    <meta name="theme-color" content="#1a1a2e">
    <title>Snake Game - Professional Edition</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            font-size: 16px;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 1rem;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 2rem;
            max-width: 600px;
            width: 100%;
        }

        .header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .header h1 {
            font-size: 2.5rem;
            color: #1a1a2e;
            margin-bottom: 0.5rem;
        }

        .header p {
            color: #666;
            font-size: 0.95rem;
        }

        .stats-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .stat {
            background: #f5f5f5;
            padding: 1rem;
            border-radius: 10px;
            text-align: center;
            border-left: 4px solid #667eea;
        }

        .stat-label {
            font-size: 0.85rem;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 0.5rem;
        }

        .stat-value {
            font-size: 1.75rem;
            font-weight: bold;
            color: #1a1a2e;
        }

        .game-board {
            background: #1a1a2e;
            border-radius: 15px;
            margin-bottom: 2rem;
            overflow: hidden;
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.3);
        }

        canvas {
            display: block;
            width: 100%;
            height: auto;
            background: #0f0f1e;
        }

        .controls {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .difficulty-control {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .difficulty-control label {
            font-size: 0.85rem;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
        }

        .difficulty-buttons {
            display: flex;
            gap: 0.5rem;
        }

        .difficulty-btn {
            flex: 1;
            padding: 0.75rem;
            border: 2px solid #ddd;
            background: white;
            color: #333;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }

        .difficulty-btn:hover {
            border-color: #667eea;
            color: #667eea;
        }

        .difficulty-btn.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .buttons-container {
            display: flex;
            gap: 1rem;
        }

        button {
            flex: 1;
            padding: 1rem;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-play {
            background: #4caf50;
            color: white;
        }

        .btn-play:hover:not(:disabled) {
            background: #45a049;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(76, 175, 80, 0.3);
        }

        .btn-pause {
            background: #ff9800;
            color: white;
        }

        .btn-pause:hover:not(:disabled) {
            background: #e68900;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 152, 0, 0.3);
        }

        .btn-reset {
            background: #f44336;
            color: white;
        }

        .btn-reset:hover:not(:disabled) {
            background: #da190b;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(244, 67, 54, 0.3);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .instructions {
            background: #f9f9f9;
            border-radius: 10px;
            padding: 1.5rem;
            margin-top: 2rem;
            border-left: 4px solid #667eea;
        }

        .instructions h3 {
            color: #1a1a2e;
            margin-bottom: 1rem;
            font-size: 1rem;
        }

        .instructions ul {
            list-style: none;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.75rem;
        }

        .instructions li {
            color: #666;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
        }

        .instructions li:before {
            content: "▸";
            color: #667eea;
            margin-right: 0.5rem;
            font-weight: bold;
        }

        .game-over-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .game-over-modal.show {
            display: flex;
        }

        .modal-content {
            background: white;
            border-radius: 20px;
            padding: 2rem;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 400px;
        }

        .modal-content h2 {
            color: #f44336;
            font-size: 2rem;
            margin-bottom: 1rem;
        }

        .modal-content .final-score {
            font-size: 1.5rem;
            color: #1a1a2e;
            margin-bottom: 1.5rem;
            padding: 1rem;
            background: #f5f5f5;
            border-radius: 10px;
        }

        .modal-content .final-score strong {
            display: block;
            font-size: 2.5rem;
            color: #667eea;
        }

        .modal-buttons {
            display: flex;
            gap: 1rem;
            margin-top: 1.5rem;
        }

        .modal-buttons button {
            flex: 1;
        }

        @media (max-width: 480px) {
            .container {
                padding: 1.5rem;
            }

            .header h1 {
                font-size: 1.75rem;
            }

            .stats-container {
                grid-template-columns: 1fr;
            }

            .controls {
                grid-template-columns: 1fr;
            }

            .instructions ul {
                grid-template-columns: 1fr;
            }

            .difficulties-buttons {
                flex-wrap: wrap;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            * {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🐍 Snake Game</h1>
            <p>Classic snake gameplay with modern controls</p>
        </div>

        <div class="stats-container">
            <div class="stat">
                <div class="stat-label">Score</div>
                <div class="stat-value" id="score">0</div>
            </div>
            <div class="stat">
                <div class="stat-label">Best Score</div>
                <div class="stat-value" id="bestScore">0</div>
            </div>
            <div class="stat">
                <div class="stat-label">Level</div>
                <div class="stat-value" id="level">1</div>
            </div>
        </div>

        <div class="game-board">
            <canvas id="gameCanvas" width="400" height="400"></canvas>
        </div>

        <div class="controls">
            <div class="difficulty-control">
                <label for="difficulty">Difficulty</label>
                <div class="difficulty-buttons">
                    <button class="difficulty-btn active" data-difficulty="easy">Easy</button>
                    <button class="difficulty-btn" data-difficulty="medium">Medium</button>
                    <button class="difficulty-btn" data-difficulty="hard">Hard</button>
                </div>
            </div>
        </div>

        <div class="buttons-container">
            <button class="btn-play" id="playBtn">Play</button>
            <button class="btn-pause" id="pauseBtn" disabled>Pause</button>
            <button class="btn-reset" id="resetBtn">Reset</button>
        </div>

        <div class="instructions">
            <h3>How to Play</h3>
            <ul>
                <li>Use Arrow Keys to move</li>
                <li>Eat the red food</li>
                <li>Don't hit the walls</li>
                <li>Don't hit yourself</li>
                <li>Each food = +10 points</li>
                <li>Can also use WASD</li>
            </ul>
        </div>
    </div>

    <div class="game-over-modal" id="gameOverModal">
        <div class="modal-content">
            <h2>Game Over!</h2>
            <div class="final-score">
                Final Score
                <strong id="finalScore">0</strong>
            </div>
            <div class="modal-buttons">
                <button class="btn-play" onclick="game.reset(); game.start()">Play Again</button>
                <button class="btn-reset" onclick="document.getElementById('gameOverModal').classList.remove('show')">Close</button>
            </div>
        </div>
    </div>

    <script>
        /**
         * Professional Snake Game
         * A fully-featured implementation with difficulty levels, score tracking, and smooth gameplay
         */
        const game = {
            canvas: document.getElementById('gameCanvas'),
            ctx: null,
            gridSize: 20,
            tileCount: 0,
            snake: [],
            food: null,
            direction: { x: 1, y: 0 },
            nextDirection: { x: 1, y: 0 },
            score: 0,
            bestScore: localStorage.getItem('snakeBestScore') || 0,
            gameRunning: false,
            gamePaused: false,
            difficulty: 'easy',
            speeds: {
                easy: 100,
                medium: 75,
                hard: 40
            },
            gameLoopId: null,
            level: 1,

            /**
             * Initialize the game
             */
            init() {
                this.ctx = this.canvas.getContext('2d');
                this.tileCount = this.canvas.width / this.gridSize;
                this.setupEventListeners();
                this.loadBestScore();
                this.reset();
            },

            /**
             * Setup all event listeners
             */
            setupEventListeners() {
                // Keyboard controls
                document.addEventListener('keydown', (e) => this.handleInput(e));

                // Button controls
                document.getElementById('playBtn').addEventListener('click', () => this.start());
                document.getElementById('pauseBtn').addEventListener('click', () => this.togglePause());
                document.getElementById('resetBtn').addEventListener('click', () => this.reset());

                // Difficulty buttons
                document.querySelectorAll('.difficulty-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => this.setDifficulty(e.target.dataset.difficulty));
                });
            },

            /**
             * Handle keyboard input
             */
            handleInput(e) {
                if (!this.gameRunning || this.gamePaused) return;

                const key = e.key.toLowerCase();
                const keyMap = {
                    'arrowup': { x: 0, y: -1 },
                    'w': { x: 0, y: -1 },
                    'arrowdown': { x: 0, y: 1 },
                    's': { x: 0, y: 1 },
                    'arrowleft': { x: -1, y: 0 },
                    'a': { x: -1, y: 0 },
                    'arrowright': { x: 1, y: 0 },
                    'd': { x: 1, y: 0 }
                };

                if (keyMap[key]) {
                    e.preventDefault();
                    // Prevent 180-degree turns
                    if (this.direction.x + keyMap[key].x !== 0 || this.direction.y + keyMap[key].y !== 0) {
                        this.nextDirection = keyMap[key];
                    }
                }
            },

            /**
             * Set game difficulty
             */
            setDifficulty(level) {
                if (this.gameRunning) return;

                this.difficulty = level;

                // Update UI
                document.querySelectorAll('.difficulty-btn').forEach(btn => {
                    btn.classList.remove('active');
                });
                event.target.classList.add('active');

                this.updateLevel();
            },

            /**
             * Start the game
             */
            start() {
                if (this.gameRunning) return;

                this.gameRunning = true;
                this.gamePaused = false;
                document.getElementById('playBtn').disabled = true;
                document.getElementById('pauseBtn').disabled = false;
                document.querySelectorAll('.difficulty-btn').forEach(btn => btn.disabled = true);

                this.gameLoopId = setInterval(() => this.update(), this.speeds[this.difficulty]);
            },

            /**
             * Toggle pause
             */
            togglePause() {
                if (!this.gameRunning) return;

                this.gamePaused = !this.gamePaused;
                document.getElementById('pauseBtn').textContent = this.gamePaused ? 'Resume' : 'Pause';
            },

            /**
             * Update game state
             */
            update() {
                if (this.gamePaused) return;

                this.direction = this.nextDirection;

                // Calculate new head position
                const head = {
                    x: this.snake[0].x + this.direction.x,
                    y: this.snake[0].y + this.direction.y
                };

                // Check wall collision
                if (head.x < 0 || head.x >= this.tileCount || head.y < 0 || head.y >= this.tileCount) {
                    this.endGame();
                    return;
                }

                // Check self collision
                if (this.snake.some(segment => segment.x === head.x && segment.y === head.y)) {
                    this.endGame();
                    return;
                }

                this.snake.unshift(head);

                // Check food collision
                if (head.x === this.food.x && head.y === this.food.y) {
                    this.score += 10;
                    this.updateLevel();
                    this.food = this.generateFood();
                } else {
                    this.snake.pop();
                }

                this.updateUI();
                this.draw();
            },

            /**
             * Draw the game
             */
            draw() {
                // Clear canvas
                this.ctx.fillStyle = '#0f0f1e';
                this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);

                // Draw grid
                this.ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)';
                this.ctx.lineWidth = 0.5;
                for (let i = 0; i <= this.tileCount; i++) {
                    const pos = i * this.gridSize;
                    this.ctx.beginPath();
                    this.ctx.moveTo(pos, 0);
                    this.ctx.lineTo(pos, this.canvas.height);
                    this.ctx.stroke();

                    this.ctx.beginPath();
                    this.ctx.moveTo(0, pos);
                    this.ctx.lineTo(this.canvas.width, pos);
                    this.ctx.stroke();
                }

                // Draw snake
                this.snake.forEach((segment, index) => {
                    if (index === 0) {
                        // Head
                        this.ctx.fillStyle = '#4caf50';
                        this.ctx.shadowColor = 'rgba(76, 175, 80, 0.5)';
                        this.ctx.shadowBlur = 10;
                    } else {
                        // Body
                        this.ctx.fillStyle = '#45a049';
                        this.ctx.shadowColor = 'transparent';
                    }

                    this.ctx.fillRect(
                        segment.x * this.gridSize + 1,
                        segment.y * this.gridSize + 1,
                        this.gridSize - 2,
                        this.gridSize - 2
                    );
                });

                this.ctx.shadowColor = 'transparent';

                // Draw food
                this.ctx.fillStyle = '#f44336';
                this.ctx.shadowColor = 'rgba(244, 67, 54, 0.5)';
                this.ctx.shadowBlur = 10;
                this.ctx.beginPath();
                this.ctx.arc(
                    this.food.x * this.gridSize + this.gridSize / 2,
                    this.food.y * this.gridSize + this.gridSize / 2,
                    this.gridSize / 2 - 2,
                    0,
                    Math.PI * 2
                );
                this.ctx.fill();
            },

            /**
             * Generate random food position
             */
            generateFood() {
                let food;
                let isOnSnake;

                do {
                    food = {
                        x: Math.floor(Math.random() * this.tileCount),
                        y: Math.floor(Math.random() * this.tileCount)
                    };
                    isOnSnake = this.snake.some(segment => segment.x === food.x && segment.y === food.y);
                } while (isOnSnake);

                return food;
            },

            /**
             * Update UI displays
             */
            updateUI() {
                document.getElementById('score').textContent = this.score;
                document.getElementById('level').textContent = this.level;
            },

            /**
             * Update level based on score
             */
            updateLevel() {
                this.level = Math.floor(this.score / 50) + 1;
            },

            /**
             * End the game
             */
            endGame() {
                this.gameRunning = false;
                this.gamePaused = false;
                clearInterval(this.gameLoopId);

                // Update best score
                if (this.score > this.bestScore) {
                    this.bestScore = this.score;
                    localStorage.setItem('snakeBestScore', this.bestScore);
                    document.getElementById('bestScore').textContent = this.bestScore;
                }

                document.getElementById('finalScore').textContent = this.score;
                document.getElementById('gameOverModal').classList.add('show');

                document.getElementById('playBtn').disabled = false;
                document.getElementById('pauseBtn').disabled = true;
                document.getElementById('pauseBtn').textContent = 'Pause';
                document.querySelectorAll('.difficulty-btn').forEach(btn => btn.disabled = false);
            },

            /**
             * Reset the game
             */
            reset() {
                this.gameRunning = false;
                this.gamePaused = false;
                clearInterval(this.gameLoopId);

                this.snake = [{ x: 10, y: 10 }];
                this.direction = { x: 1, y: 0 };
                this.nextDirection = { x: 1, y: 0 };
                this.score = 0;
                this.level = 1;
                this.food = this.generateFood();

                document.getElementById('playBtn').disabled = false;
                document.getElementById('pauseBtn').disabled = true;
                document.getElementById('pauseBtn').textContent = 'Pause';
                document.querySelectorAll('.difficulty-btn').forEach(btn => btn.disabled = false);
                document.getElementById('gameOverModal').classList.remove('show');

                this.updateUI();
                this.draw();
            },

            /**
             * Load best score from storage
             */
            loadBestScore() {
                document.getElementById('bestScore').textContent = this.bestScore;
            }
        };

        // Initialize game when page loads
        document.addEventListener('DOMContentLoaded', () => game.init());
    </script>
</body>
</html>
